<!doctype html>
<html lang="he" dir="rtl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Polin";
        font-weight: 300;
        src: url("fonts/Polin-Light.woff2") format("woff2");
      }
      @font-face {
        font-family: "Polin";
        font-weight: 500;
        src: url("fonts/Polin-Medium.woff2") format("woff2");
      }
      @font-face {
        font-family: "Polin";
        font-weight: 600;
        src: url("fonts/Polin-Semibold.woff2") format("woff2");
      }
      :root {
        --ground: #fdfdfd;
        --ink: #202020;
        --gap: 40px; /* one spacing value between every text block */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        font-family: "Polin", sans-serif;
        color: var(--ink);
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* ---------- product scene ---------- */
      #p-fade {
        position: absolute;
        inset: 0;
      }
      #top-logo {
        position: absolute;
        top: 150px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
      }
      #top-logo img {
        display: block;
        width: 300px;
        height: auto;
      }

      /* ring stage: 1080 x 920, photo shown at 1.12x so the whole ring is the hero */
      #stage {
        position: absolute;
        top: 340px;
        left: 0;
        width: 1080px;
        height: 920px;
        overflow: hidden;
        -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 43%, #000 66%, transparent 100%);
        mask-image: radial-gradient(ellipse 60% 60% at 50% 43%, #000 66%, transparent 100%);
      }
      #ring-move,
      #ring-wrap {
        position: absolute;
        inset: 0;
      }
      .ring {
        position: absolute;
        top: -155px;
        left: -3px;
        width: 1147px;
        height: 1147px;
        display: block;
      }
      #ring-yellow,
      #ring-rose {
        opacity: 0;
      }
      .shine-lane {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      .shine {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 920px;
        background: linear-gradient(
          105deg,
          rgba(255, 255, 255, 0) 38%,
          rgba(255, 255, 255, 0.7) 50%,
          rgba(255, 255, 255, 0) 62%
        );
      }

      /* ---------- copy: one column, equal gaps ---------- */
      #copy {
        position: absolute;
        top: 1170px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
        text-align: center;
      }
      #title {
        font-weight: 600;
        font-size: 100px;
        line-height: 110px;
        letter-spacing: 0.005em;
      }
      #sub {
        font-weight: 300;
        font-size: 46px;
        line-height: 56px;
        letter-spacing: 0.03em;
      }
      #slot {
        position: relative;
        width: 1080px;
        height: 200px;
      }
      #tones,
      #price {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #dots {
        display: flex;
        justify-content: center;
        gap: 30px;
        direction: ltr;
      }
      .dot {
        position: relative;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1.5px solid var(--ink);
      }
      .dot i {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        opacity: 0;
      }
      #d-white i {
        background: #cfcfcf;
      }
      #d-yellow i {
        background: #d2ad5c;
      }
      #d-rose i {
        background: #d99a82;
      }
      #tone-slot {
        position: relative;
        width: 1080px;
        height: 56px;
        margin-top: 26px;
      }
      .tone {
        position: absolute;
        inset: 0;
        font-weight: 300;
        font-size: 46px;
        line-height: 56px;
        letter-spacing: 0.03em;
        opacity: 0;
      }
      #price {
        opacity: 0;
      }
      #price .from {
        font-weight: 300;
        font-size: 46px;
        line-height: 56px;
        letter-spacing: 0.03em;
      }
      #price .num {
        margin-top: 6px;
        font-weight: 500;
        font-size: 132px;
        line-height: 136px;
        letter-spacing: 0.01em;
      }

      /* ---------- end card ---------- */
      #end {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 120px;
      }
      #end-logo {
        display: block;
        width: 660px;
        height: auto;
        opacity: 0;
      }
      #end-url {
        margin-top: 70px;
        font-weight: 300;
        font-size: 46px;
        letter-spacing: 0.12em;
        direction: ltr;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16.5"
      data-width="1080"
      data-height="1920"
    >
      <section id="product" class="clip" data-start="0" data-duration="14.2" data-track-index="0">
        <div id="p-fade">
          <div id="top-logo"><img id="top-logo-img" src="assets/logo-black.png" alt="ALMORA" /></div>

          <div id="stage">
            <div id="ring-move">
              <div id="ring-wrap">
                <img class="ring" id="ring-white" src="assets/ring-white.webp" alt="" />
                <img class="ring" id="ring-yellow" src="assets/ring-yellow.webp" alt="" />
                <img class="ring" id="ring-rose" src="assets/ring-rose.webp" alt="" />
              </div>
              <div class="shine-lane"><div class="shine" id="shine" data-layout-allow-overflow></div></div>
            </div>
          </div>

          <div id="copy">
            <h1 id="title">טבעת סוליטר עגול</h1>
            <p id="sub">כסף 925 · מוסונייט</p>
            <div id="slot">
              <div id="tones">
                <div id="dots">
                  <span class="dot" id="d-white"><i></i></span>
                  <span class="dot" id="d-yellow"><i></i></span>
                  <span class="dot" id="d-rose"><i></i></span>
                </div>
                <div id="tone-slot">
                  <p class="tone" id="t-white">זהב לבן</p>
                  <p class="tone" id="t-yellow">זהב צהוב</p>
                  <p class="tone" id="t-rose">רוז גולד</p>
                </div>
              </div>
              <div id="price">
                <p class="from">החל מ</p>
                <p class="num" dir="ltr">₪575</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="end" class="clip" data-start="13.4" data-duration="3.1" data-track-index="1">
        <img id="end-logo" src="assets/logo-black.png" alt="ALMORA" />
        <p id="end-url">almora.co.il</p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const soft = "power2.inOut";
      const out = "expo.out";

      // opening: logo and ring already on screen at frame 0 (cover frame)
      tl.fromTo("#top-logo-img", { opacity: 0.4, y: -8 }, { opacity: 1, y: 0, duration: 1.2, ease: out }, 0);
      tl.fromTo("#ring-move", { opacity: 0.6 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0);
      tl.fromTo("#ring-wrap", { scale: 1.1 }, { scale: 1.0, duration: 1.8, ease: out }, 0);
      tl.to("#ring-wrap", { scale: 1.05, duration: 8.6, ease: "none" }, 1.8);

      // copy
      tl.fromTo("#title", { opacity: 0, y: 26, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.1, ease: out }, 0.8);
      tl.fromTo("#sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1.0, ease: out }, 1.2);

      // tone row
      tl.fromTo("#dots", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.9, ease: out }, 1.7);
      tl.fromTo("#d-white i", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: soft }, 1.9);
      tl.fromTo("#t-white", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: soft }, 1.9);

      // light sweeps across the metal
      const sweep = (at) =>
        tl.fromTo("#shine", { xPercent: -110 }, { xPercent: 110, duration: 1.3, ease: "power1.inOut" }, at);
      sweep(2.4);

      // white gold -> yellow gold
      tl.to("#ring-yellow", { opacity: 1, duration: 1.2, ease: soft }, 3.9);
      tl.to("#t-white", { opacity: 0, duration: 0.5, ease: soft }, 4.0);
      tl.to("#d-white i", { opacity: 0, duration: 0.6, ease: soft }, 4.1);
      tl.to("#d-yellow i", { opacity: 1, duration: 0.6, ease: soft }, 4.3);
      tl.to("#t-yellow", { opacity: 1, duration: 0.7, ease: soft }, 4.5);
      sweep(5.6);

      // yellow gold -> rose gold
      tl.to("#ring-rose", { opacity: 1, duration: 1.2, ease: soft }, 7.4);
      tl.to("#t-yellow", { opacity: 0, duration: 0.5, ease: soft }, 7.5);
      tl.to("#d-yellow i", { opacity: 0, duration: 0.6, ease: soft }, 7.6);
      tl.to("#d-rose i", { opacity: 1, duration: 0.6, ease: soft }, 7.8);
      tl.to("#t-rose", { opacity: 1, duration: 0.7, ease: soft }, 8.0);
      sweep(9.0);

      // price replaces the tone row in the same slot
      tl.to("#tones", { opacity: 0, y: -10, duration: 0.6, ease: soft }, 10.6);
      tl.fromTo("#price", { opacity: 0, y: 20, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.1, ease: out }, 11.0);

      // hand-off to the end card
      tl.to("#p-fade", { opacity: 0, duration: 0.9, ease: soft }, 13.3);
      tl.fromTo("#end-logo", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 1.4, ease: out }, 13.8);
      tl.fromTo("#end-url", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1.0, ease: out }, 14.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

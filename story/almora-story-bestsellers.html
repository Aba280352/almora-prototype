<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>ALMORA story — Best Sellers + ALMORA15</title>
<!-- Instagram story 1080x1920. Fonts = Polin from ../fonts (same files the site loads), logo = site header logo, colors = ALMORA global colors. -->
<style>
@font-face{font-family:"Polin";font-weight:300;src:url("../fonts/Polin-Light.woff2") format("woff2")}
@font-face{font-family:"Polin";font-weight:400;src:url("../fonts/Polin-Regular.woff2") format("woff2")}
@font-face{font-family:"Polin";font-weight:500;src:url("../fonts/Polin-Medium.woff2") format("woff2")}
@font-face{font-family:"Polin";font-weight:600;src:url("../fonts/Polin-Semibold.woff2") format("woff2")}
:root{--text:#202020;--bg:#FFFFFF;--surface:#F5F5F5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--surface);overflow:hidden}
body{font-family:"Polin",sans-serif;color:var(--text);position:relative}
/* key content between y=245 and y=1690 (Instagram UI covers the very top and bottom) */
.logo{position:absolute;top:220px;left:50%;transform:translateX(-50%);width:380px;height:auto;display:block}
.eyebrow{position:absolute;top:458px;left:0;right:0;text-align:center;font-size:40px;font-weight:500;letter-spacing:.2em;padding-inline-start:.2em;line-height:1.2;direction:ltr}
h1{position:absolute;top:506px;left:0;right:0;text-align:center;font-size:136px;font-weight:600;line-height:1.1}
.grid{position:absolute;top:676px;left:40px;width:1000px;display:grid;grid-template-columns:repeat(2,488px);gap:20px 24px;direction:rtl}
.card{position:relative;width:488px;height:266px;background:var(--bg);border-radius:12px;overflow:hidden}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* per-photo framing: the product photos have different proportions and a lot of white around the piece */
.z-8368 img{object-fit:contain;transform:scale(1.02)}
.z-8131 img{transform:scale(1.04);transform-origin:50% 56%}
.z-7311 img{transform:scale(1.4);transform-origin:50% 50%}
.z-6577 img{transform:scale(1.0);transform-origin:50% 50%}
.z-8345 img{object-fit:contain;transform:scale(1.02)}
.z-8362 img{object-fit:contain;transform:scale(1.25);transform-origin:50% 50%}
.coupon{position:absolute;top:1536px;left:40px;width:1000px;height:180px;border-radius:12px;background:var(--text);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.coupon .lbl{font-size:30px;font-weight:400;letter-spacing:.04em;opacity:.8;line-height:1.2}
.coupon .code{margin-top:2px;font-size:84px;font-weight:600;letter-spacing:.14em;line-height:1.05;direction:ltr;padding-inline-start:.14em}
.coupon .sub{margin-top:4px;font-size:32px;font-weight:300;line-height:1.2}
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="ALMORA">
<div class="eyebrow">BEST SELLERS</div>
<h1>הנבחרים שלנו</h1>
<div class="grid">
  <div class="card z-8368"><img src="img/8368.webp" alt=""></div>
  <div class="card z-8131"><img src="img/8131.webp" alt=""></div>
  <div class="card z-7311"><img src="img/7311.webp" alt=""></div>
  <div class="card z-6577"><img src="img/6577.webp" alt=""></div>
  <div class="card z-8345"><img src="img/8345.webp" alt=""></div>
  <div class="card z-8362"><img src="img/8362.webp" alt=""></div>
</div>
<div class="coupon">
  <div class="lbl">קוד קופון</div>
  <div class="code">ALMORA15</div>
  <div class="sub">הקלידו בקופה וקבלו 15% הנחה</div>
</div>
</body>
</html>
